<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <!-- Applies the saved theme before first paint so a forced light or dark never flashes the other. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("prep-theme");
          if (t !== "light" && t !== "dark") return;
          document.documentElement.setAttribute("data-theme", t);
          var m = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < m.length; i++) {
            m[i].media = "all";
            m[i].content = t === "dark" ? "#0d0d0d" : "#ffffff";
          }
        } catch (e) {}
      })();
    </script>
    <title>Prep</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/PlexSans-Variable.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root">
      <!-- Boot shell: the same header the app renders, so first paint is the real
           chrome instead of a blank page while the script loads. React replaces it. -->
      <header class="top">
        <div class="top-inner">
          <a class="brand" href="/"><span class="brand-mark"><svg class="icon" aria-hidden="true" fill="currentColor"><use href="/icons.svg#i-target" /></svg></span>Prep</a>
          <nav class="tabs" aria-label="Main">
            <a class="tab" href="/"><svg class="icon" aria-hidden="true" fill="currentColor"><use href="/icons.svg#i-sun-horizon" /></svg><span>Today</span></a>
            <a class="tab" href="/plan"><svg class="icon" aria-hidden="true" fill="currentColor"><use href="/icons.svg#i-calendar-blank" /></svg><span>Plan</span></a>
            <a class="tab" href="/problems"><svg class="icon" aria-hidden="true" fill="currentColor"><use href="/icons.svg#i-list-checks" /></svg><span>Problems</span></a>
            <a class="tab" href="/design"><svg class="icon" aria-hidden="true" fill="currentColor"><use href="/icons.svg#i-book-open-text" /></svg><span>Design</span></a>
            <a class="tab" href="/stats"><svg class="icon" aria-hidden="true" fill="currentColor"><use href="/icons.svg#i-chart-bar" /></svg><span>Stats</span></a>
          </nav>
        </div>
      </header>
      <main><div class="skeleton" aria-busy="true"><span class="sk sk-line" style="width:120px"></span><span class="sk sk-title"></span><span class="sk sk-line" style="width:52%"></span><span class="sk sk-panel"></span></div></main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
